databases:
  - name: strapi-db
    databaseName: strapi
    user: strapi
    plan: basic-256mb

services:
  - type: web
    name: strapi-cms
    runtime: node
    rootDir: cms
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_CLIENT
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: strapi-db
          property: connectionString
      - key: HOST
        value: "0.0.0.0"
      - key: APP_KEYS
        generateValue: true
      - key: API_TOKEN_SALT
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: TRANSFER_TOKEN_SALT
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      # Set this manually in Render dashboard after deploying Vercel frontend
      - key: FRONTEND_URL
        sync: false
