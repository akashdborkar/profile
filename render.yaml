services:
  - type: web
    name: strapi-cms
    runtime: node
    rootDir: cms
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      # Caps V8 heap at 400 MB — prevents OOM crashes on Render's 512 MB RAM limit.
      # Without this flag the Strapi admin webpack build is reliably killed mid-build.
      - key: NODE_OPTIONS
        value: "--max-old-space-size=400"
      - key: DATABASE_CLIENT
        value: postgres
      # Paste your Neon / Supabase connection string in the Render dashboard.
      # Neon free tier: https://neon.tech  (0.5 GB, always-on)
      # Supabase free tier: https://supabase.com  (500 MB, pauses after 1 week inactive)
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_POOL_MIN
        value: "2"
      - key: DATABASE_POOL_MAX
        value: "4"
      - key: HOST
        value: "0.0.0.0"
      # Render injects PORT automatically; Strapi reads it via env('PORT', 1337)
      - key: APP_KEYS
        generateValue: true
      - key: API_TOKEN_SALT
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: TRANSFER_TOKEN_SALT
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      # Cloudinary — media uploads (ephemeral Render FS requires external storage)
      - key: CLOUDINARY_NAME
        sync: false
      - key: CLOUDINARY_KEY
        sync: false
      - key: CLOUDINARY_SECRET
        sync: false
      # Set after deploying Vercel frontend (used for CORS + webhook allow-list)
      - key: FRONTEND_URL
        sync: false
